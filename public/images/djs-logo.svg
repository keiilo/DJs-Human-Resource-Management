<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DJ's FoodHub logo">
  <defs>
    <radialGradient id="djBall" cx="38%" cy="24%" r="80%">
      <stop offset="0" stop-color="#FFFBD1"/>
      <stop offset=".42" stop-color="#FFE761"/>
      <stop offset="1" stop-color="#E0AF00"/>
    </radialGradient>
    <linearGradient id="djWord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7C4"/>
      <stop offset=".45" stop-color="#F6D356"/>
      <stop offset="1" stop-color="#C09210"/>
    </linearGradient>
    <linearGradient id="djHand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A8"/>
      <stop offset=".55" stop-color="#F2D354"/>
      <stop offset="1" stop-color="#C99B14"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="30" fill="#050505"/>
  <rect x="16" y="16" width="480" height="480" rx="20" fill="none" stroke="#ffffff" stroke-width="7" opacity=".95"/>

  <!-- glossy badge -->
  <circle cx="286" cy="208" r="122" fill="#F4DE72" opacity=".28"/>
  <circle cx="286" cy="208" r="116" fill="url(#djBall)" stroke="#0D0D0D" stroke-width="7"/>
  <path d="M199 152a116 116 0 0 1 128-52" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="12" stroke-linecap="round"/>

  <!-- thumbs up -->
  <g transform="rotate(-8 172 246)">
    <path d="M134 240c-6 0-10 5-10 11v46c0 6 4 11 10 11h20v-68z" fill="url(#djHand)" stroke="#0D0D0D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M154 306v-52c0-24 6-42 18-54 6-6 14-6 18 0 5 7 3 17-1 25-3 6-7 13-7 19h25c17 0 29 9 32 22 2 8-2 14-6 19 4 5 5 12 2 18-3 7-8 10-13 12 0 6-4 11-9 14-6 4-13 5-21 5h-22c-9 0-16-4-16-8z" fill="url(#djHand)" stroke="#0D0D0D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M182 252c10 3 16 3 24 2M184 274c11 3 19 3 27 1M186 295c10 2 17 2 24 0" fill="none" stroke="#0D0D0D" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  </g>

  <!-- face -->
  <text x="292" y="224" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="88" font-weight="900" fill="#101010" letter-spacing="-4">dj&#8217;s</text>
  <path d="M232 258c12 34 32 50 58 50s46-16 58-50" fill="none" stroke="#101010" stroke-width="9" stroke-linecap="round"/>
  <path d="M302 298c9 13 24 17 34 8 7-7 3-17-6-19-8-2-16 3-28 11z" fill="#E2352B" stroke="#101010" stroke-width="4" stroke-linejoin="round"/>

  <!-- bow tie -->
  <path d="M288 334l-52-26v58z" fill="#101010" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M288 334l52-26v58z" fill="#101010" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="288" cy="334" r="15" fill="#101010" stroke="#ffffff" stroke-width="5"/>
  <text x="288" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">18</text>

  <!-- wordmark -->
  <text x="256" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="url(#djWord)" stroke="#FAF3C8" stroke-width="1.6" paint-order="stroke" letter-spacing="1">FoodHuB</text>
</svg>
